name: cms
recipe: laravel
config:
  php: '8.3'
  composer_version: '2'
  via: nginx
  webroot: public
  database: postgres:16
  cache: redis
  xdebug: false

services:
  # Node for building Filament panel assets
  node:
    type: node:20

  # MinIO — local S3-compatible storage for your media
  minio:
    type: compose
    services:
      image: minio/minio
      command: server /data --console-address ":9001"
      environment:
        MINIO_ROOT_USER: lando
        MINIO_ROOT_PASSWORD: landopassword
      ports:
        - "9000:9000"
        - "9001:9001"
      volumes:
        - minio-data:/data
    volumes:
      minio-data:

  # One-shot init: waits for MinIO, then creates + configures the bucket
  minio-init:
    type: compose
    services:
      image: minio/mc
      # depends_on ensures minio is up before this runs
      depends_on:
        - minio
      # entrypoint runs once and exits
      entrypoint: >
        /bin/sh -c "
        until mc alias set local http://minio:9000 lando landopassword; do
          echo 'waiting for minio...'; sleep 1;
        done;
        mc mb --ignore-existing local/cms-media;
        mc anonymous set download local/cms-media;
        echo 'bucket cms-media ready';
        "

tooling:
  npm:
    service: node
  node:
    service: node
  artisan:
    service: appserver
    cmd: php artisan